<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pass Manager</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
    <style>
        body {
            padding-top: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .btn-group {
            display: flex;
            gap: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Pass Manager</h1>
    <hr>
    <div class="text-center mb-4">
        <a th:href="@{/addnew}" class="btn btn-primary">Create New Pass</a>
    </div>

    <h2>Active Passes</h2>
    <table class="table table-striped table-responsive-md">
        <thead>
        <tr>
            <th>Pass ID</th>
            <th>Meeting Name</th>
            <th>Status</th>
            <th class="text-center">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="data:${passlist}">
            <td th:text="${data.passId}"></td>
            <td th:text="${data.meetingName}"></td>
            <td th:text="${data.passStatus}"></td>
            <td class="text-center">
                <div class="btn-group">
                    <a th:href="@{/passupdateform/{passid}(passid=${data.passId})}"
                       class="btn btn-info btn-sm">Update</a>
                    <a th:href="@{/deletepass/{passid}(passid=${data.passId})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this pass?');">Delete</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
