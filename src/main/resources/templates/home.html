<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">>
<head>
    <meta charset="UTF-8">
    <title>Pass Manager</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>


<body>
<h1>Pass Manager</h1>
<div class="conatiner my-2" align="center"></div>
<div class="text-center" >
<a  th:href="@{/addnew}" class="btn btn-primary btn-sm mb-3" >Create New Pass</a></div>
<h2>Active passes </h2>
<table style="width:80%" border="1" class = "table table-striped table-responsive-md">
    <thead>
    <tr>
        <th>PassId</th>
        <th>Meeting Name</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="data:${passlist}">
        <td th:text="${data.passId}"></td>
        <td th:text="${data.meetingName}"></td>
        <td th:text="${data.passStatus}"></td>
        <td>
            <a th:href="@{/passupdateform/{passid}(passid=${data.passId})}"
               class="btn btn-primary">Update</a>
            <a th:href="@{/deletepass/{passid}(passid=${data.passId})}"
               class="btn btn-danger">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
